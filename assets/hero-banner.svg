<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Gradient Definitions -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07090e"/>
      <stop offset="50%" style="stop-color:#12151e"/>
      <stop offset="100%" style="stop-color:#0b0d14"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="35%" style="stop-color:#f87171"/>
      <stop offset="65%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#b91c1c"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="50%" style="stop-color:#f87171"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>

    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.35"/>
      <stop offset="70%" style="stop-color:#dc2626;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="centerBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#dc2626" flood-opacity="0.8" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Wave Pattern -->
    <pattern id="wavePattern" x="0" y="0" width="1200" height="320" patternUnits="userSpaceOnUse">
      <path d="M0,160 Q300,110 600,160 T1200,160" fill="none" stroke="url(#accentGradient)" stroke-width="1" opacity="0.22">
        <animate attributeName="d" dur="8s" repeatCount="indefinite"
          values="M0,160 Q300,110 600,160 T1200,160;
                  M0,160 Q300,190 600,160 T1200,160;
                  M0,160 Q300,110 600,160 T1200,160"/>
      </path>
      <path d="M0,190 Q300,140 600,190 T1200,190" fill="none" stroke="#f87171" stroke-width="0.7" opacity="0.16">
        <animate attributeName="d" dur="10s" repeatCount="indefinite"
          values="M0,190 Q300,140 600,190 T1200,190;
                  M0,190 Q300,220 600,190 T1200,190;
                  M0,190 Q300,140 600,190 T1200,190"/>
      </path>
    </pattern>

    <!-- Circuit Pattern -->
    <pattern id="circuitPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="60" height="60" fill="none"/>
      <path d="M0,30 L60,30 M30,0 L30,60" stroke="#dc2626" stroke-width="0.35" opacity="0.1"/>
      <circle cx="30" cy="30" r="2.5" fill="#dc2626" opacity="0.18"/>
      <circle cx="0" cy="0" r="1.5" fill="#dc2626" opacity="0.12"/>
      <circle cx="60" cy="0" r="1.5" fill="#dc2626" opacity="0.12"/>
      <circle cx="0" cy="60" r="1.5" fill="#dc2626" opacity="0.12"/>
      <circle cx="60" cy="60" r="1.5" fill="#dc2626" opacity="0.12"/>
    </pattern>

    <!-- Blockchain cube symbol -->
    <g id="cube">
      <path d="M0,0 L18,-10 L36,0 L36,18 L18,28 L0,18 Z" fill="#dc2626" fill-opacity="0.85"/>
      <path d="M18,-10 L36,0 L36,18 L18,28" fill="none" stroke="#f87171" stroke-width="1.2" stroke-opacity="0.9"/>
      <path d="M0,0 L18,-10 L36,0 L18,10 Z" fill="#f87171" fill-opacity="0.5"/>
      <path d="M0,0 L18,10 L18,28 L0,18 Z" fill="#991b1b" fill-opacity="0.75"/>
    </g>
  </defs>

  <!-- Background Layers -->
  <rect width="1200" height="320" fill="url(#bgGradient)"/>
  <rect width="1200" height="320" fill="url(#circuitPattern)"/>
  <rect width="1200" height="320" fill="url(#wavePattern)"/>
  <rect width="1200" height="320" fill="url(#centerBurst)"/>

  <!-- Glow Orbs -->
  <circle cx="180" cy="110" r="160" fill="url(#glowGradient)" filter="url(#glow)">
    <animate attributeName="r" values="160;195;160" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.6;0.35" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="210" r="140" fill="url(#glowGradient)" filter="url(#glow)">
    <animate attributeName="r" values="140;175;140" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.5;0.25" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="60" r="120" fill="url(#glowGradient)" filter="url(#glow)">
    <animate attributeName="r" values="120;150;120" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.45;0.2" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating Particle System -->
  <circle r="2" fill="#dc2626" opacity="0.8">
    <animateMotion path="M50,260 Q200,60 400,210 Q600,310 800,110 Q1000,260 1150,160" dur="15s" repeatCount="indefinite" rotate="auto"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;3;1" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.5" fill="#f87171" opacity="0.6">
    <animateMotion path="M100,60 Q300,260 500,120 Q700,60 900,220 Q1100,120 1200,300" dur="18s" repeatCount="indefinite" rotate="auto"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#ef4444" opacity="0.7">
    <animateMotion path="M200,290 Q400,90 600,270 Q800,60 1000,250" dur="12s" repeatCount="indefinite" rotate="auto"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;4;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.8" fill="#991b1b" opacity="0.5">
    <animateMotion path="M50,120 Q250,290 450,90 Q650,320 850,140 Q1050,290 1200,110" dur="20s" repeatCount="indefinite" rotate="auto"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="20s" repeatCount="indefinite"/>
  </circle>

  <!-- Left Blockchain Cube Cluster -->
  <g transform="translate(85, 145) scale(1.35)">
    <use href="#cube">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="3.5s" repeatCount="indefinite"/>
    </use>
    <use href="#cube" transform="translate(26, -10)" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="26,-10;26,-24;26,-10" dur="3.5s" repeatCount="indefinite" begin="0.35s"/>
    </use>
    <use href="#cube" transform="translate(52, 0)" opacity="0.55">
      <animateTransform attributeName="transform" type="translate" values="52,0;52,-14;52,0" dur="3.5s" repeatCount="indefinite" begin="0.7s"/>
    </use>
  </g>

  <!-- Right Blockchain Cube Cluster -->
  <g transform="translate(1015, 145) scale(1.35)">
    <use href="#cube">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="4s" repeatCount="indefinite"/>
    </use>
    <use href="#cube" transform="translate(26, -10)" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="26,-10;26,-24;26,-10" dur="4s" repeatCount="indefinite" begin="0.4s"/>
    </use>
    <use href="#cube" transform="translate(52, 0)" opacity="0.55">
      <animateTransform attributeName="transform" type="translate" values="52,0;52,-14;52,0" dur="4s" repeatCount="indefinite" begin="0.8s"/>
    </use>
  </g>

  <!-- Main Content -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 42)">
      <rect x="-140" y="-13" width="280" height="26" rx="13" fill="#dc2626" fill-opacity="0.16" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.55"/>
      <text x="0" y="4" text-anchor="middle" font-size="10.5" font-weight="700" fill="#f87171" letter-spacing="1.8" style="text-transform:uppercase">SIH-26125 • ZERO-KNOWLEDGE PROVENANCE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="132" text-anchor="middle" font-size="50" font-weight="900" fill="url(#textGradient)" filter="url(#textGlow)" letter-spacing="3">
      SECURECHAIN
    </text>

    <!-- Subtitle -->
    <text x="600" y="180" text-anchor="middle" font-size="16" font-weight="500" fill="#cbd5e1" letter-spacing="0.5">
      Enterprise Digital Identity, Monitored Assets &amp; Document Provenance
    </text>

    <!-- Tagline -->
    <text x="600" y="212" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f87171" opacity="0.95" letter-spacing="2.5" style="text-transform:uppercase">
      Zero Confidential Bytes On-Chain • Cryptographic RBAC • Defense-Grade
    </text>

    <!-- Status Indicators -->
    <g transform="translate(600, 260)">
      <g transform="translate(-210, 0)">
        <circle r="5.5" fill="#22c55e" filter="url(#glow)">
          <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="14" y="4" font-size="11" fill="#86efac" font-weight="600">Polygon Amoy ✓</text>
      </g>
      <g transform="translate(-30, 0)">
        <circle r="5.5" fill="#22c55e" filter="url(#glow)">
          <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" begin="0.4s"/>
        </circle>
        <text x="14" y="4" font-size="11" fill="#86efac" font-weight="600">Zero Leakage S3 ✓</text>
      </g>
      <g transform="translate(150, 0)">
        <circle r="5.5" fill="#22c55e" filter="url(#glow)">
          <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" begin="0.8s"/>
        </circle>
        <text x="14" y="4" font-size="11" fill="#86efac" font-weight="600">4-Step Verifier ✓</text>
      </g>
    </g>
  </g>

  <!-- Top Accent Laser -->
  <line x1="280" y1="26" x2="920" y2="26" stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;640" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dasharray" values="180,460;460,180" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Bottom Accent Laser -->
  <line x1="280" y1="295" x2="920" y2="295" stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="640;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dasharray" values="460,180;180,460" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Corner Brackets -->
  <g stroke="#dc2626" stroke-width="2" opacity="0.55">
    <path d="M45,45 L90,45 M45,45 L45,90">
      <animate attributeName="stroke-dashoffset" values="0;90" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="45,45;0,90" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M1155,45 L1110,45 M1155,45 L1155,90">
      <animate attributeName="stroke-dashoffset" values="0;90" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="45,45;0,90" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M45,275 L90,275 M45,275 L45,230">
      <animate attributeName="stroke-dashoffset" values="0;90" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="45,45;0,90" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M1155,275 L1110,275 M1155,275 L1155,230">
      <animate attributeName="stroke-dashoffset" values="0;90" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="45,45;0,90" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
